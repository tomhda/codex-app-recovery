name: Tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ['3.10', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: python -m py_compile recovery.py setup_recovery.py i18n.py
      - if: runner.os == 'Windows'
        run: |
          python recovery.py --gui-smoke --lang en
          python recovery.py --gui-smoke --lang ja
